[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mophong-gplx"
version = "0.1.0"
description = "Ung dung luyen thi mo phong GPLX chay offline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6.12,<7",
]

[project.scripts]
mophong-gplx = "gplx_sim.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gplx_sim = ["data/*.sql", "resources/*.qss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
